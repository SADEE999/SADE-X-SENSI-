name: SADEE X DIMA - ZIP Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sadee-x-dima
  cancel-in-progress: true

jobs:

  # ============================================================
  # BUILD ANDROID APK
  # ============================================================
  build-apk:
    name: Extract ZIP & Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR ZIP"
          echo "======================================"

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo ""
          echo "======================================"
          echo "EXTRACTED FILES"
          echo "======================================"

          find extracted -maxdepth 8 -type f | sort

      - name: Find Android project
        id: android
        shell: bash
        run: |
          set -e

          PROJECT=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ANDROID PROJECT"
          echo "======================================"

          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"

      - name: Verify Java and Gradle
        run: |
          echo "======================================"
          echo "JAVA"
          echo "======================================"

          java -version

          echo ""
          echo "======================================"
          echo "GRADLE"
          echo "======================================"

          gradle --version

      - name: Enable AndroidX
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ENABLING ANDROIDX"
          echo "======================================"

          touch gradle.properties

          sed -i '/^android\.useAndroidX=/d' gradle.properties || true
          sed -i '/^android\.enableJetifier=/d' gradle.properties || true

          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          echo ""
          echo "GRADLE.PROPERTIES:"
          cat gradle.properties

      - name: Fix Gradle repositories
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          echo ""
          echo "======================================"
          echo "SETTINGS.GRADLE"
          echo "======================================"

          cat settings.gradle

      - name: Validate XML resources
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECKING XML RESOURCES"
          echo "======================================"

          find app/src/main/res -type f -name "*.xml" -print0 |
          while IFS= read -r -d '' file; do
            if grep -n '&[^a-zA-Z#]' "$file" >/dev/null 2>&1; then
              echo "WARNING: Possible invalid XML entity:"
              grep -n '&[^a-zA-Z#]' "$file" || true
            fi
          done

          echo "XML CHECK COMPLETE"

      - name: Inspect Android project
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD.GRADLE"
          echo "======================================"

          cat build.gradle || true

          echo ""
          echo "======================================"
          echo "APP BUILD.GRADLE"
          echo "======================================"

          cat app/build.gradle || true

          echo ""
          echo "======================================"
          echo "GRADLE.PROPERTIES"
          echo "======================================"

          cat gradle.properties || true

      - name: Build APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          set +e

          echo ""
          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build.log

          RESULT=${PIPESTATUS[0]}

          echo ""
          echo "======================================"
          echo "BUILD ERROR SUMMARY"
          echo "======================================"

          grep -E \
            "FAILURE:|error:|Error:|Caused by:|Execution failed|Could not|AAPT|Manifest|resource|XMLStreamException|SAXParseException" \
            build.log \
            | tail -200 || true

          echo ""
          echo "======================================"
          echo "GRADLE EXIT CODE"
          echo "======================================"

          echo "$RESULT"

          exit "$RESULT"

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostic-log
          path: |
            ${{ steps.android.outputs.project }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # ============================================================
  # ADMIN DASHBOARD → GH-PAGES
  # ============================================================
  deploy-admin:
    name: Extract Admin & Publish
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -maxdepth 1 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            ls -la
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |
          set -e

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            echo "admin-dashboard folder not found."

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html not found."

              find extracted \
                -maxdepth 10 \
                -type f \
                | sort

              exit 1
            fi

            ADMIN=$(dirname "$INDEX")
          fi

          echo ""
          echo "======================================"
          echo "ADMIN DASHBOARD"
          echo "======================================"

          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"

      - name: Prepare website
        shell: bash
        run: |
          set -e

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo ""
          echo "======================================"
          echo "WEBSITE FILES"
          echo "======================================"

          find public \
            -maxdepth 8 \
            -type f \
            | sort

      - name: Publish Admin Dashboard
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
