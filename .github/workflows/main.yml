name: SADEE X DIMA - ZIP Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # =====================================================
  # ANDROID APK
  # =====================================================

  build-apk:

    name: Extract ZIP & Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      - name: Extract ZIP
        shell: bash
        run: |

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted

          echo "===== EXTRACTED ====="
          find extracted -maxdepth 5 -type f | sort


      - name: Find Android Project
        id: android
        shell: bash
        run: |

          PROJECT=$(find extracted \
            -type f \
            -name "settings.gradle" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "ANDROID PROJECT:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Setup Gradle 8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"


      - name: Verify Gradle
        run: gradle --version


      - name: Fix Gradle Repository
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          if [ -f settings.gradle ]; then

            sed -i \
              's/RepositoriesMode\.FAIL_ON_PROJECT_REPOS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

            sed -i \
              's/RepositoriesMode\.PREFER_SETTINGS/RepositoriesMode.PREFER_PROJECT/g' \
              settings.gradle || true

          fi

          cat settings.gradle


      - name: Build APK
        working-directory: ${{ steps.android.outputs.project }}
        shell: bash
        run: |

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-X-DIMA-APK
          path: |
            ${{ steps.android.outputs.project }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


  # =====================================================
  # ADMIN DASHBOARD
  # =====================================================

  deploy-admin:

    name: Extract Admin & Publish
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Find ZIP
        id: zip
        shell: bash
        run: |

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"


      - name: Extract ZIP
        run: |

          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.zip.outputs.zip_file }}" -d extracted


      - name: Find Admin Dashboard
        id: admin
        shell: bash
        run: |

          ADMIN=$(find extracted \
            -type d \
            -name "admin-dashboard" \
            | head -n 1)

          if [ -z "$ADMIN" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "ERROR: index.html not found"
              exit 1
            fi

            ADMIN=$(dirname "$INDEX")

          fi

          echo "ADMIN:"
          echo "$ADMIN"

          echo "admin=$ADMIN" >> "$GITHUB_OUTPUT"


      - name: Prepare Website
        run: |

          rm -rf public
          mkdir -p public

          cp -R \
            "${{ steps.admin.outputs.admin }}/." \
            public/

          touch public/.nojekyll

          echo "===== WEBSITE ====="
          find public -maxdepth 4 -type f | sort


      # =================================================
      # PUBLISH TO GH-PAGES
      # =================================================

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          force_orphan: true
          enable_jekyll: false
