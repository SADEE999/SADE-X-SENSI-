<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SADEE X DIMA • Admin Control Center</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body>
<div id="login" class="screen"><div class="login-card"><div class="logo-mark">◆</div><h1>SADEE X DIMA</h1><p>ADMIN CONTROL CENTER</p><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">SIGN IN</button><small id="loginMsg"></small></div></div>
<div id="app" class="hidden"><header><div><h1>SADEE X DIMA</h1><p>ADMIN CONTROL CENTER</p></div><button id="refresh">↻</button></header><section class="online"><span class="shield">⬟</span><div><b>SYSTEM ONLINE</b><small>Supabase license service connected</small></div><i></i></section>
<section class="stats"><div><strong id="active">0</strong><span>ACTIVE</span></div><div><strong id="unused">0</strong><span>UNUSED</span></div><div><strong id="paused">0</strong><span>PAUSED</span></div><div><strong id="expired">0</strong><span>EXPIRED</span></div></section>
<section class="generator"><h2>⚡ QUICK LICENSE GENERATOR</h2><div class="plans"><button class="plan selected" data-plan="7 Days" data-price="500">7 DAYS<small>LKR 500</small></button><button class="plan" data-plan="1 Month" data-price="1000">1 MONTH<small>LKR 1,000</small></button><button class="plan" data-plan="Lifetime" data-price="2200">LIFETIME<small>LKR 2,200</small></button></div><button id="generate" class="primary">🔑 GENERATE KEY</button></section>
<section class="overview"><h2>▥ PLAN OVERVIEW</h2><div class="overview-grid"><div><b>7 DAYS</b><strong>LKR 500</strong><small id="c7">0 keys</small></div><div><b>1 MONTH</b><strong>LKR 1,000</strong><small id="c30">0 keys</small></div><div><b>LIFETIME</b><strong>LKR 2,200</strong><small id="clife">0 keys</small></div></div></section>
<section class="licenses"><div class="section-head"><h2>KEYS</h2><input id="search" placeholder="Search key / device / status..."></div><div class="filters"><button class="filter active" data-status="all">ALL</button><button class="filter" data-status="unused">UNUSED</button><button class="filter" data-status="active">ACTIVE</button><button class="filter" data-status="paused">PAUSED</button><button class="filter" data-status="expired">EXPIRED</button></div><div id="list"></div></section>
</div><script src="app.js"></script></body></html>
